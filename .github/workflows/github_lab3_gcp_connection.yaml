name: Lab3 - Train and Save Best Model to GCS

on:
  schedule:
    - cron: '0 0 * * *'   # Run every day at midnight
  workflow_dispatch:        # Allow manual trigger

env:
  GCS_BUCKET_NAME: mlops-lab3-vikas

jobs:
  train_and_save:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Get pip cache directory
        id: pip-cache-dir
        run: echo "dir=$(pip cache dir)" >> $GITHUB_OUTPUT

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.pip-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Labs/Github_Labs/Lab3/requirements.txt

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: Train models and save best to GCS
        run: |
          python Labs/Github_Labs/Lab3/train_and_save_model.py

      - name: Workflow Summary
        run: |
          echo "## ✅ Lab 3 Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "- Trained **Random Forest** and **Gradient Boosting** on Iris dataset" >> $GITHUB_STEP_SUMMARY
          echo "- Best model selected and uploaded to **gs://mlops-lab3-vikas/trained_models/**" >> $GITHUB_STEP_SUMMARY
          echo "- Triggered at: $(date)" >> $GITHUB_STEP_SUMMARY
